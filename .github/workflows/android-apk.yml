name: Build installable APK

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Test, lint and build signed debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SafeBaiyun-multi-door.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/SafeBaiyun-multi-door.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/SafeBaiyun-multi-door.apk
          sha256sum dist/SafeBaiyun-multi-door.apk > dist/SafeBaiyun-multi-door.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SafeBaiyun-multi-door-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  publish-widget-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/widget-doors'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SafeBaiyun-multi-door-apk
          path: dist
      - name: Verify and publish v1.4.0
        run: |
          sha256sum --check dist/SafeBaiyun-multi-door.apk.sha256
          (cd dist && sha256sum SafeBaiyun-multi-door.apk > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          ## 白云通 1.4.0 · 独立门禁组件
          - 添加每个桌面组件时独立选择门禁，可放置多个同样或不同样式的组件。
          - 组件显示绑定门禁名称，点击开锁只打开该门禁，不跟随默认门禁。
          - 点击组件上的“更换门禁”可重新配置。
          - 门禁修改后刷新组件；删除绑定门禁后提示重选，不回退到其他门禁。
          - 清理已删除组件的绑定，并支持系统恢复时迁移组件 ID。
          - 保留多门禁管理、JSON 导出分享和粘贴导入功能。

          下载 SafeBaiyun-multi-door.apk 直接安装。Debug 签名版。
          升级前请先用旧版导出全部门禁 JSON；若签名冲突需卸载重装，再导入配置并重新添加组件。
          单元测试、Lint、构建和签名检查由 Actions 验证；各品牌启动器和实际蓝牙开门仍需现场测试。
          NOTES
          gh release create v1.4.0 dist/SafeBaiyun-multi-door.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "白云通 1.4.0 · 独立门禁组件" --notes-file notes.md --draft
          gh release edit v1.4.0 --draft=false --latest
