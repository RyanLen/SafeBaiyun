name: Build installable APK

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Test, lint and build signed debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SafeBaiyun-multi-door.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/SafeBaiyun-multi-door.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/SafeBaiyun-multi-door.apk
          sha256sum dist/SafeBaiyun-multi-door.apk > dist/SafeBaiyun-multi-door.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SafeBaiyun-multi-door-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
